<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Dashboard | API Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        accent: {
                            DEFAULT: '#7c3aed',
                            dark: '#6d28d9',
                            light: '#a78bfa',
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-neutral-50 text-neutral-900 dark:bg-[#0a0a0a] dark:text-neutral-100 transition-colors duration-300;
            }
        }
        @layer components {
            .section-container {
                @apply max-w-4xl mx-auto px-6 py-16 md:py-24;
            }
            .glass-card {
                @apply bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl shadow-sm transition-all duration-200;
            }
            .badge {
                @apply px-3 py-1 rounded-full text-[11px] font-medium uppercase tracking-wider border transition-all;
            }
        }
    </style>
</head>
<body>
    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-[#0a0a0a]/80 backdrop-blur-md border-b border-neutral-200 dark:border-neutral-800">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="text-sm font-bold tracking-tight">
                <span class="text-accent">&lt;Clark</span><span class="text-neutral-500">Martinez.dev/&gt;</span>
            </div>
            
            <a href="index.html" class="px-4 py-2 bg-accent hover:bg-accent-dark text-white rounded-lg text-xs font-semibold transition-all flex items-center gap-2">
                <span>←</span> Back to Portfolio
            </a>
        </div>
    </nav>

    <main class="section-container">
        <div class="space-y-12">
            <div class="text-center">
                <span class="text-accent text-[10px] font-bold tracking-[0.2em] uppercase">API Integration</span>
                <h2 class="text-3xl font-bold tracking-tight mt-2">Mini <span class="text-neutral-500">Dashboard</span></h2>
                <p class="text-sm text-neutral-500 mt-2">Live data fetched from public APIs</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Crypto Tracker Card -->
                <div class="glass-card p-6 space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-lg">Crypto Tracker</h3>
                        <span class="text-[10px] bg-accent/10 text-accent px-2 py-0.5 rounded border border-accent/20">CoinGecko API</span>
                    </div>
                    <div id="crypto-list" class="space-y-3">
                        <div class="animate-pulse flex space-x-4">
                            <div class="flex-1 space-y-4 py-1">
                                <div class="h-4 bg-neutral-200 dark:bg-neutral-800 rounded w-3/4"></div>
                                <div class="h-4 bg-neutral-200 dark:bg-neutral-800 rounded"></div>
                            </div>
                        </div>
                    </div>
                    <button onclick="fetchCrypto()" class="w-full py-2 border border-neutral-200 dark:border-neutral-800 rounded-lg text-xs font-medium hover:border-accent transition-colors">
                        Refresh Data
                    </button>
                </div>

                <!-- Random Fact Card -->
                <div class="glass-card p-6 space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-lg">Random Tech Fact</h3>
                        <span class="text-[10px] bg-emerald-500/10 text-emerald-500 px-2 py-0.5 rounded border border-emerald-500/20">UselessFacts API</span>
                    </div>
                    <div id="fact-container" class="min-h-[100px] flex items-center justify-center italic text-sm text-neutral-600 dark:text-neutral-400 text-center">
                        <p>Loading interesting fact...</p>
                    </div>
                    <button onclick="fetchFact()" class="w-full py-2 border border-neutral-200 dark:border-neutral-800 rounded-lg text-xs font-medium hover:border-accent transition-colors">
                        Get New Fact
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function fetchCrypto() {
            const list = document.getElementById('crypto-list');
            list.innerHTML = `<div class="animate-pulse space-y-3">
                <div class="h-10 bg-neutral-100 dark:bg-neutral-800 rounded-lg"></div>
                <div class="h-10 bg-neutral-100 dark:bg-neutral-800 rounded-lg"></div>
                <div class="h-10 bg-neutral-100 dark:bg-neutral-800 rounded-lg"></div>
            </div>`;
            
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,cardano&vs_currencies=usd&include_24hr_change=true');
                const data = await res.json();
                
                list.innerHTML = Object.keys(data).map(key => `
                    <div class="flex items-center justify-between p-3 bg-neutral-100 dark:bg-neutral-800/50 rounded-lg border border-transparent hover:border-accent transition-all">
                        <div class="flex items-center gap-3">
                            <span class="font-bold capitalize">${key}</span>
                        </div>
                        <div class="text-right">
                            <div class="font-bold">$${data[key].usd.toLocaleString()}</div>
                            <div class="text-[10px] ${data[key].usd_24h_change >= 0 ? 'text-emerald-500' : 'text-rose-500'} font-bold">
                                ${data[key].usd_24h_change >= 0 ? '↑' : '↓'} ${Math.abs(data[key].usd_24h_change).toFixed(2)}%
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = '<p class="text-rose-500 text-xs text-center py-4">Error fetching crypto data. Rate limit might be reached.</p>';
            }
        }

        async function fetchFact() {
            const container = document.getElementById('fact-container');
            container.innerHTML = '<p class="animate-pulse">Fetching fact...</p>';
            
            try {
                const res = await fetch('https://uselessfacts.jsph.pl/random.json?language=en');
                const data = await res.json();
                container.innerHTML = `<p>"${data.text}"</p>`;
            } catch (err) {
                container.innerHTML = '<p class="text-rose-500">Failed to fetch fact.</p>';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchCrypto();
            fetchFact();
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
</body>
</html>
